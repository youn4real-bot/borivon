<!doctype html>
<html lang="de">

<!--HEAD-->
<style>
/* Founder spec 2026-11-08 (fahrplan-form-spec.html): one question per screen, small dots = questions of the
   current part, a calm "Teil X von 4 erledigt" popup between parts. Since 2026-11-09 in the borivon.com
   look: warm paper, EB Garamond headings, Inter text, square corners, ink buttons (content/pflege/bv.css). */
:root{--bg:#f4f1ea;--card:#fbfaf6;--line:#ddd6c8;--ink:#15130f;--soft:#3b372f;--mute:#837c6f;--gold:#a8843a;--gold-d:#8a6a28;--gold-l:#ece0c0;--sel:#f3ecdc;--veil:rgba(244,241,234,.9);--err:#9a4a33;
--display:'EB Garamond','Iowan Old Style',Georgia,serif;--body:'Inter','Segoe UI',system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
 padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{font-family:var(--display);font-style:italic;font-weight:500;font-size:26px;letter-spacing:-.01em;text-decoration:none}
.mark b{color:var(--gold);font-style:normal}
.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:all .3s}
.dots i.f{background:var(--gold)}
.dots i.c{background:var(--gold);box-shadow:0 0 0 4px var(--gold-l)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:44px}
.screen{animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,8.4vw,60px);line-height:1.02;letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:clamp(29px,6.4vw,40px);line-height:1.1;letter-spacing:-.02em;margin:0 0 30px;text-wrap:balance}
h1 em,h2 em{color:var(--gold-d);font-weight:400}
.sub{color:var(--soft);margin:16px 0 0;font-size:18px;line-height:1.55}
svg.i{width:28px;height:28px;stroke:var(--gold-d);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.qi{width:52px;height:52px;border-radius:50%;background:transparent;border:1px solid var(--line);display:grid;place-items:center;margin-bottom:20px}
.qi svg.i{width:24px;height:24px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;min-height:100px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font:inherit;font-weight:400;color:var(--ink);cursor:pointer;position:relative;transition:border-color .3s var(--ease),background .3s var(--ease),transform .2s var(--ease),box-shadow .4s var(--ease)}
.opt.plain{min-height:0;justify-content:center;padding:20px 18px}
.opts.one .opt{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.opt:hover{border-color:var(--ink);box-shadow:0 14px 30px -24px rgba(32,26,16,.45)}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--ink);background:var(--sel)}
.opt .tick{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2,#cfc7b7);display:grid;place-items:center}
.opt .tick svg{width:12px;height:12px;stroke:var(--card);fill:none;stroke-width:3;opacity:0}
.opt.on .tick{background:var(--ink);border-color:var(--ink)}
.opt.on .tick svg{opacity:1}
.lvl{display:flex;gap:4px;align-items:flex-end;height:26px}
.lvl b{width:8px;border-radius:1px;background:var(--line)}
.lvl b.f{background:var(--gold)}
.badge{font-family:var(--display);font-weight:500;font-size:30px;color:var(--gold-d);line-height:1;font-variant-numeric:lining-nums}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:30px;gap:12px}
.btn{font:inherit;font-weight:500;border:none;border-radius:3px;padding:17px 32px;cursor:pointer;background:var(--ink);color:var(--bg);text-decoration:none;display:inline-flex;align-items:center;transition:background .4s var(--ease)}
.btn:hover{background:#2c271f}
.btn.gold{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.back{background:none;border:none;font:inherit;font-size:20px;color:var(--mute);cursor:pointer;padding:6px 0}
.back:hover{color:var(--ink)}
select,input[type=text],input[type=email],input[type=date]{font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px;width:100%;transition:border-color .3s}
select:focus,input[type=text]:focus,input[type=email]:focus,input[type=date]:focus{outline:none;border-color:var(--ink)}
.fields{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--soft);margin-top:6px;cursor:pointer}
.check input{accent-color:var(--gold);width:18px;height:18px;flex:none}
.center{text-align:center}
.qsub{margin:-18px 0 26px;color:var(--soft);font-size:16px}
.intro{display:flex;align-items:center;gap:12px;margin:0 0 26px;font-size:12px;letter-spacing:.17em;text-transform:uppercase;font-weight:500;color:var(--gold-d)}
.intro::before{content:"";width:28px;height:1px;background:currentColor;opacity:.75}
.priv{display:flex;gap:10px;align-items:flex-start;margin:34px 0 0;font-size:13px;color:var(--mute);line-height:1.5}
.priv svg.i{width:18px;height:18px;margin-top:1px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:inherit;font-weight:400;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 18px;cursor:pointer;color:var(--ink);transition:border-color .3s}
.pill.on{border-color:var(--ink);background:var(--sel)}
.trust{margin:2px 0 0;font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.err{margin:0;font-size:14px;color:var(--err)}
.err:empty{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pop{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;z-index:5;animation:fade .25s ease both}
.pop .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:40px 32px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 30px 70px -30px rgba(32,26,16,.4);animation:rise .6s var(--ease) both}
.ring{width:84px;height:84px;margin:0 auto 22px}
.ring circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:240;stroke-dashoffset:240;animation:draw .6s ease .1s forwards}
.ring path{fill:none;stroke:var(--gold-d);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s ease .55s forwards}
.pop h2{margin:0 0 6px}
.pop p{margin:0;color:var(--soft)}
.track{display:flex;gap:6px;justify-content:center;margin-top:22px}
.track i{width:34px;height:3px;border-radius:2px;background:var(--line)}
.track i.f{background:var(--gold)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.92)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.screen,.pop,.pop .card{animation:none}.ring circle,.ring path{animation:none;stroke-dashoffset:0}}
.build{display:grid;gap:16px;margin-top:6px}
.build div{display:flex;align-items:center;gap:14px;font-weight:400;transition:opacity .4s}
.build div.wait{opacity:.25}
.foot{align-self:center;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--mute)}
.foot a{color:var(--mute);text-decoration:none}
</style>
</head>

 {c:1,id:'plaetze',ic:'bed',q:function(a){return t.size(a,true)},when:function(a){return a.standorte!=='1'},o:o(t.plaetze,{'<50':L(1),'50-100':L(2),'100-200':L(3),'200+':L(4)})},

]}
function $(id){return document.getElementById(id)}
var app=$('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cur(){return Q()[i]}
function dots(){var all=Q(),qs=all.filter(function(x){return x.c===all[i].c&&(!x.when||x.when(A))}),n=qs.findIndex(function(x){return x.id===all[i].id});
 $('dots').innerHTML=qs.map(function(x,k){return '<i class="'+(k<n?'f':k===n?'c':'')+'"></i>'}).join('')}
function nextIdx(f){var all=Q();for(var k=f+1;k<all.length;k++)if(!all[k].when||all[k].when(A))return k;return -2}
function go(k){hist.push(i);var prev=cur().c;i=k;err='';if(Q()[k].c!==prev)return cheer(prev,render);render()}
function back(){if(!hist.length)return;i=hist.pop();err='';render()}
function cheer(c,next){var t=T[lang],d=document.createElement('div');d.className='pop';
 d.innerHTML='<div class="card" role="status"><svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38"/><path d="M27 43l10 10 20-22"/></svg><h2>'+esc(t.part.replace('{n}',c+1))+'</h2><p>'+esc(t.nextPart.replace('{p}',t.parts[c]))+'</p><div class="track">'+[0,1,2,3].map(function(k){return '<i class="'+(k<=c?'f':'')+'"></i>'}).join('')+'</div></div>';
 document.body.appendChild(d);setTimeout(function(){d.remove();next()},1100)}
function visual(v){if(!v)return '';if(typeof v==='string')return ic(v);if('lvl' in v)return '<span class="lvl" aria-hidden="true">'+[1,2,3,4].map(function(n){return '<b class="'+(n<=v.lvl?'f':'')+'" style="height:'+(6+n*5)+'px"></b>'}).join('')+'</span>';if(v.b)return '<span class="badge" aria-hidden="true">'+v.b+'</span>';return ''}

function tr(){if(window.bvTrack)window.bvTrack.apply(null,arguments)}
function render(){
 var t=T[lang],q=cur();document.documentElement.lang=lang;tr('q_view',q.id,i);
 dots();
 var title=q.type==='contact'?q.q:esc(typeof q.q==='function'?q.q(A):q.q);
 var h='<div class="screen">'+(i===0&&!hist.length?'<p class="intro">'+esc(t.intro)+'</p>':'')+'<div class="qi">'+ic(q.ic)+'</div><h2>'+title+'</h2>'+(q.sub?'<p class="qsub">'+esc(q.sub)+'</p>':'');
 if(q.type==='select')h+='<select id="f" aria-label="Bundesland"><option value="">'+esc(t.pick)+'</option>'+Object.keys(LAENDER).map(function(k){return '<option value="'+k+'"'+(A.land===k?' selected':'')+'>'+LAENDER[k]+'</option>'}).join('')+'</select>';
 else if(q.type==='date')h+='<input type="date" id="f" aria-label="'+esc(t.datum)+'" min="'+new Date().toISOString().slice(0,10)+'" value="'+esc(A.datum||'')+'">';
 else if(q.type==='contact'){var c=A.kontakt;h+='<form id="cf" class="fields" novalidate>'+
  '<div class="pills" role="radiogroup" aria-label="'+esc(t.salAria)+'">'+['frau','herr','none'].map(function(a){return '<button type="button" class="pill'+(c.anrede===a?' on':'')+'" role="radio" aria-checked="'+(c.anrede===a)+'" data-a="'+a+'">'+esc(t.sal[a])+'</button>'}).join('')+'</div>'+
  '<div class="two"><input type="text" id="c-vor" placeholder="'+esc(t.first)+'" aria-label="'+esc(t.first)+'" maxlength="80" value="'+esc(c.vor)+'" autocomplete="given-name"><input type="text" id="c-nach" placeholder="'+esc(t.last)+'" aria-label="'+esc(t.last)+'" maxlength="80" value="'+esc(c.nach)+'" autocomplete="family-name"></div>'+
  '<input type="email" id="c-mail" placeholder="'+esc(t.mail)+'" aria-label="'+esc(t.mail)+'" maxlength="254" value="'+esc(c.mail)+'" autocomplete="email">'+
  '<label class="hp" aria-hidden="true">Website<input type="text" id="c-web" tabindex="-1" autocomplete="off"></label>'+
  '<p class="err" id="c-err" role="alert">'+esc(err)+'</p>'+
  '<p class="trust">'+esc(t.trust)+'</p>'+
  '<label class="check"><input type="checkbox" id="c-ok"'+(c.consent?' checked':'')+'><span>'+esc(t.consent)+' <a href="/datenschutz" target="_blank" rel="noopener">'+esc(t.privacyLink)+'</a></span></label>'+
  '<div class="row"><button type="button" class="back" id="bk" aria-label="'+esc(t.back)+'">←</button><button class="btn gold" type="submit"'+(busy?' disabled':'')+'>'+esc(busy?t.sending:t.submit)+'</button></div></form>'}
 else{var m=!!q.multi,cv=m?(A[q.id]||[]):A[q.id];h+='<div class="opts'+(q.one?' one':'')+'">'+q.o.map(function(x){var on=m?cv.indexOf(x[0])>=0:cv===x[0];
  return '<button type="button" class="opt'+(x[2]?'':' plain')+(on?' on':'')+'" data-v="'+esc(x[0])+'" aria-pressed="'+on+'">'+(m?'<span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span>':'')+visual(x[2])+'<span>'+esc(x[1])+'</span></button>'}).join('')+'</div>'}
 if(q.type!=='contact'){var nb=q.multi||q.type;h+='<div class="row"><button type="button" class="back" id="bk" aria-label="'+esc(t.back)+'"'+(hist.length?'':' style="visibility:hidden"')+'>←</button>'+(nb?'<button type="button" class="btn" id="nx">'+esc(t.next)+'</button>':'')+'</div>'}
 if(i===0)h+='<p class="priv">'+ic('shield')+'<span>'+esc(t.priv)+' <a href="/datenschutz" target="_blank" rel="noopener">'+esc(t.privacyLink)+'</a></span></p>';
 app.innerHTML=h+'</div>';$('bk').onclick=back;var nx=$('nx');
 if(q.type==='select'||q.type==='date'){var f=$('f'),up=function(){nx.disabled=!f.value};f.oninput=f.onchange=up;up();nx.onclick=function(){A[q.id]=f.value;tr('q_answer',q.id,q.type==='date'?'date':f.value);go(nextIdx(i))}}
 else if(q.multi){nx.disabled=!(A[q.id]||[]).length;
  // multi-choice: toggle in place, no re-render, no animation (only Weiter moves on)
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var v=(A[q.id]||[]).slice(),k=b.getAttribute('data-v');
   if(k==='none')v=v.indexOf(k)>=0?[]:[k];else{v=v.filter(function(x){return x!=='none'});v=v.indexOf(k)>=0?v.filter(function(x){return x!==k}):v.concat([k])}
   A[q.id]=v;app.querySelectorAll('.opt').forEach(function(x){var on=v.indexOf(x.getAttribute('data-v'))>=0;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});nx.disabled=!v.length}});
  nx.onclick=function(){tr('q_answer',q.id,(A[q.id]||[]).join(','));go(nextIdx(i))}}
 else if(q.type==='contact'){var cc=A.kontakt;
  app.querySelectorAll('.pill').forEach(function(b){b.onclick=function(){cc.anrede=b.getAttribute('data-a');app.querySelectorAll('.pill').forEach(function(x){x.classList.toggle('on',x===b);x.setAttribute('aria-checked',x===b)})}});
  $('cf').onsubmit=function(e){e.preventDefault();submit()}}
 else app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){A[q.id]=b.getAttribute('data-v');tr('q_answer',q.id,A[q.id]);b.classList.add('on');setTimeout(function(){go(nextIdx(i))},220)}});
}

function showErr(m){err=m;var el=$('c-err');if(el)el.textContent=m}
function readContact(){var c=A.kontakt,g=function(id){var e=$(id);return e?e.value.trim():null},v;
 if((v=g('c-vor'))!==null)c.vor=v;if((v=g('c-nach'))!==null)c.nach=v;if((v=g('c-mail'))!==null)c.mail=v;var k=$('c-ok');if(k)c.consent=k.checked}
function submit(){
 var t=T[lang],c=A.kontakt;if(busy)return;readContact();
 if(!c.anrede||!c.vor||!c.nach)return showErr(t.errName);
 // TEST is only ever true on the founder's local test server (never on borivon.com; the server checks anyway)
 var TEST=window.BV_TEST===true;
 if(!TEST){
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.mail))return showErr(t.errMail);
 if(isFree(c.mail)){showErr(t.errBiz);$('c-mail').focus();return}
 if(!c.consent)return showErr(t.errConsent);
 }
 busy=true;err='';
 var answers={v:2,art:A.art,rolle:A.rolle,standorte:A.standorte,land:A.land,plaetze:A.plaetze,bedarf:A.bedarf,leasing:A.leasing,erfahrung:A.erfahrung,
  grund:A.erfahrung==='failed'?(A.grund||[]):[],start:A.start,datum:A.start==='date'?(A.datum||''):'',haben:(A.haben||[]).filter(function(x){return x!=='none'}),wer:A.wer};
 var req=fetch('/api/roadmap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:lang,salutation:c.anrede,firstName:c.vor,lastName:c.nach,email:c.mail,consent:c.consent===true,website:$('c-web').value,answers:answers,track:window.bvTrackContext||{}})})
  .then(function(r){if(r.status===429)throw new Error('many');if(!r.ok)return r.json().then(function(j){throw new Error((j&&j.error)||'fail')},function(){throw new Error('fail')});return r.json()});
 building(req);
}
function greet(){var c=A.kontakt;return c.nach&&(c.anrede==='frau'||c.anrede==='herr')?esc(T[lang].sal[c.anrede]+' '+c.nach)+', ':''}
function building(req){var t=T[lang],icons=['euro','cal','up','pin','clip'];$('dots').innerHTML='';
 app.innerHTML='<div class="screen"><h2>'+greet()+t.building+'</h2><div class="build">'+t.build.map(function(s,n){return '<div class="wait" id="b'+n+'">'+ic(icons[n])+esc(s)+'</div>'}).join('')+'</div></div>';
 t.build.forEach(function(_,n){setTimeout(function(){var el=$('b'+n);if(el)el.classList.remove('wait')},400+n*550)});
 var shown=new Promise(function(res){setTimeout(res,400+t.build.length*550+500)});
 Promise.all([req,shown]).then(function(r){busy=false;done(r[0])},function(e){busy=false;var m=e&&e.message;
  err=m==='business_email'?t.errBiz:m==='invalid_email'?t.errMail:m==='many'||m==='too_many'?t.errMany:m==='consent_required'?t.errConsent:m==='name_required'?t.errName:t.errSend;render()});
}
function done(j){var t=T[lang],test=!!j&&typeof j.testPdf==='string'&&j.testPdf.charAt(0)==='/';
 app.innerHTML='<div class="screen center"><div class="qi" style="margin:0 auto 22px;width:76px;height:76px">'+ic('mail')+'</div><h1>'+esc(t.doneH)+'</h1><p class="sub">'+esc(t.doneP)+'</p><p class="sub" style="font-size:14px;color:var(--mute)">'+esc(t.spam)+'</p>'+
 (test?'<div class="row" style="justify-content:center"><a class="btn gold" href="'+esc(j.testPdf)+'" target="_blank" rel="noopener">Test: Fahrplan öffnen</a></div>':'')+'</div>'}

render();
})();
