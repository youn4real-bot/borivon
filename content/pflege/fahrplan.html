<style>
:root {
  --bg: #0e0e10; --card: #18181c; --card2: #1f1f24; --line: rgba(238,236,234,0.08); --line-gold: rgba(201,162,64,0.34);
  --fg: #eeecea; --muted: #9a978f; --gold: #c9a240; --gold-soft: rgba(201,162,64,0.12); --ok: #7fb58c; --warn: #e07a5f;
  --font-display: "Playfair Display", Georgia, serif; --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2,.7,.1,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: clip; }
body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 35% at 85% 10%, rgba(201,162,64,0.14), transparent 70%), radial-gradient(35% 30% at 5% 90%, rgba(201,162,64,0.08), transparent 70%); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px clamp(16px, 4vw, 40px); }
.brand { font-family: var(--font-display); font-style: italic; font-size: 1.45rem; text-decoration: none; }
.brand span { color: var(--gold); font-style: normal; }
.langs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); }
.langs button { background: none; border: 0; padding: 6px 10px; border-radius: 999px; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold); }
.wrap { max-width: 640px; margin: 0 auto; padding: 8px 16px 64px; }
.bar { height: 3px; border-radius: 3px; background: rgba(238,236,234,0.08); overflow: hidden; margin: 6px 0 34px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, rgba(201,162,64,0.5), var(--gold)); transition: width .5s var(--ease); }
.card { background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)), var(--card); border: 1px solid var(--line); border-radius: 22px; padding: clamp(24px, 5vw, 40px); box-shadow: 0 50px 120px -40px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.05); }
.step { animation: in .45s var(--ease) both; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.eyebrow { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; }
h1, h2 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 12px; }
h1 { font-size: clamp(2rem, 1.4rem + 3vw, 3rem); }
h2 { font-size: clamp(1.6rem, 1.2rem + 2vw, 2.2rem); }
p { line-height: 1.6; color: var(--muted); margin: 0 0 18px; }
.lead { font-size: 1.05rem; color: var(--fg); }
ul.gets { list-style: none; padding: 0; margin: 0 0 26px; display: grid; gap: 10px; }
ul.gets li { display: flex; gap: 10px; align-items: baseline; line-height: 1.5; }
ul.gets li::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); transform: translateY(-1px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--gold); color: #131312; font-weight: 600; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 12px 30px -14px rgba(201,162,64,0.6); transition: transform .2s var(--ease); }
.btn:hover { transform: translateY(-1px); }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.ghost { background: none; border: 0; color: var(--muted); font-size: 0.9rem; padding: 10px 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); font-size: 1rem; transition: border-color .2s, background .2s; }
.opt:hover { border-color: var(--line-gold); }
.opt[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--fg); }
.num { display: flex; align-items: center; gap: 12px; }
.num button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,0.04); font-size: 1.4rem; flex: none; }
.num input { flex: 1; min-width: 0; text-align: center; font: 600 2.2rem var(--font-body); color: var(--fg); background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 16px; padding: 10px; -moz-appearance: textfield; }
.num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="text"], input[type="email"], input[type="tel"] { width: 100%; font: 1rem var(--font-body); color: var(--fg); background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; }
input:focus { outline: none; border-color: var(--line-gold); box-shadow: 0 0 0 4px rgba(201,162,64,0.12); }
label.f { display: grid; gap: 7px; font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; }
label.chk { display: flex; gap: 12px; align-items: flex-start; font-size: 0.9rem; line-height: 1.5; color: var(--fg); margin: 6px 0 10px; cursor: pointer; }
label.chk input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
.small { font-size: 0.8rem; color: var(--muted); }
.err { color: var(--warn); font-size: 0.9rem; min-height: 1.2em; margin: 8px 0 0; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
/* result */
.lvl { border: 1px solid var(--line-gold); background: var(--gold-soft); border-radius: 18px; padding: 22px; margin-bottom: 16px; }
.lvl .k { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.lvl b { display: block; font-family: var(--font-display); font-weight: 500; font-size: clamp(2rem, 1.5rem + 2.5vw, 2.8rem); margin: 6px 0 4px; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px; }
.seg i { height: 6px; border-radius: 3px; background: rgba(238,236,234,0.1); }
.seg i.on { background: var(--gold); }
.mm { display: grid; grid-template-columns: 52px 1fr; column-gap: 16px; align-items: center; padding: 18px 20px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 10px; }
.mm > div { display: grid; gap: 4px; min-width: 0; }
.ic { display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 50%; background: #232328; --ic-hole: #232328; --ic-base: var(--fg); --ic-accent: var(--gold); }
.ic svg { width: 56%; height: 56%; display: block; }
.ic.sm { width: 38px; height: 38px; }
.rh { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.rh .eyebrow { margin: 0 0 4px; } .rh h3 { margin: 0; }
.sh { display: flex; align-items: center; gap: 12px; }
.mm.neg { border-color: rgba(224,122,95,0.35); background: rgba(224,122,95,0.07); }
.mm.pos { border-color: rgba(127,181,140,0.4); background: rgba(127,181,140,0.08); }
.mm span { font-size: 0.9rem; color: var(--muted); }
.mm strong { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.7rem, 1.3rem + 1.8vw, 2.3rem); line-height: 1.1; }
.mm.neg strong { color: var(--warn); } .mm.pos strong { color: var(--ok); }
.sent { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); margin: 16px 0 22px; }
.sent::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(127,181,140,0.18); }
footer { text-align: center; font-size: 0.8rem; color: var(--muted); padding: 20px 16px 40px; }
footer a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } .bar i { transition: none; } }
.banner { display: block; text-align: center; text-decoration: none; padding: 11px 16px; font-size: 0.86rem; background: linear-gradient(90deg, rgba(201,162,64,0.18), rgba(201,162,64,0.08)); border-bottom: 1px solid var(--line-gold); color: var(--fg); }
.banner b { color: var(--gold); font-weight: 600; }
.two { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
.congrats { text-align: center; margin-bottom: 18px; }
.congrats h2 { margin-bottom: 4px; }
.ladder { display: grid; grid-template-columns: 0.85fr 1.2fr 0.85fr; gap: 8px; align-items: center; margin: 0 0 18px; }
.ladder.two-col { grid-template-columns: 1.2fr 0.85fr; }
.ladder .lc { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: rgba(255,255,255,0.03); opacity: 0.6; min-width: 0; }
.ladder .lc.cur { opacity: 1; border-color: var(--gold); background: var(--gold-soft); padding: 18px 16px; box-shadow: 0 18px 40px -20px rgba(201,162,64,0.55); }
.ladder .k { font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.ladder b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; margin: 4px 0 2px; overflow-wrap: anywhere; }
.ladder .lc.cur b { font-size: clamp(1.4rem, 1.1rem + 1.4vw, 1.9rem); }
.ladder small { display: block; font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
.ladder .lc.cur small { color: var(--fg); font-size: 0.85rem; }
@media (max-width: 520px) { .ladder, .ladder.two-col { grid-template-columns: 1fr; } .ladder .lc:not(.cur) { display: none; } }
.bl { margin: -4px 0 18px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); font-size: 0.95rem; line-height: 1.5; }
.bl span { display: block; font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.bl em { display: block; font-style: normal; color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
.read { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); }
.read h3 { font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; margin: 0 0 6px; }
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; counter-increment: s; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); color: #131312; font-weight: 700; font-size: 0.85rem; }
.steps b { display: block; margin-bottom: 2px; }
.steps span { color: var(--muted); line-height: 1.55; font-size: 0.94rem; }
.trap { display: flex; gap: 12px; align-items: center; margin: 14px 0 0; padding: 12px 14px; border-radius: 12px; background: rgba(224,122,95,0.08); border: 1px solid rgba(224,122,95,0.3); color: var(--fg); font-size: 0.9rem; line-height: 1.5; }
details { margin-top: 12px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,0.02); }
details summary { cursor: pointer; list-style: none; padding: 16px 18px; font-weight: 500; display: flex; justify-content: space-between; gap: 12px; }
details summary::-webkit-details-marker { display: none; }
details summary::after { content: "+"; color: var(--gold); font-size: 1.2rem; line-height: 1; }
details[open] summary::after { content: "\2212"; }
details .in { padding: 0 18px 16px; }
.p90 h4 { font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin: 14px 0 6px; font-weight: 600; }
.p90 ul, .rs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.p90 li { display: flex; gap: 10px; line-height: 1.5; font-size: 0.94rem; }
.p90 li::before { content: ""; flex: none; width: 12px; height: 12px; margin-top: 5px; border-radius: 3px; border: 1.5px solid var(--muted); }
.rs li { display: grid; grid-template-columns: 38px 1fr 1fr; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.92rem; line-height: 1.5; }
.rs li b { font-weight: 500; }
.rs li span { color: var(--muted); }
@media (max-width: 480px) { .rs li { grid-template-columns: 38px 1fr; } .rs li span { grid-column: 2; } }
.fit { margin-top: 26px; padding: 22px; border-radius: 18px; border: 1px solid var(--line-gold); background: linear-gradient(160deg, rgba(201,162,64,0.14), rgba(255,255,255,0.02) 60%); }
.fit p { color: var(--fg); margin-bottom: 14px; }
</style>

      qOnb: "Que reçoit une nouvelle infirmière pendant ses 90 premiers jours ?", hintMulti: "Plusieurs choix possibles.", onb: { mentor: "Une marraine fixe", german: "Allemand pour le travail", housing: "Aide pour le logement", plan: "Un plan d'intégration écrit", checkins: "Des entretiens réguliers" }, none: "Rien de tout ça",

      qFinish: "Presque fini.", pFinish: "Nous créons votre plan et l'envoyons à",

      consent: "J'accepte que Borivon utilise mes réponses pour créer mon plan et me l'envoyer par e-mail.", privacyLink: "Confidentialité",
      errBiz: "Merci d'utiliser votre adresse e-mail professionnelle.", errConsent: "Merci de cocher la case de confidentialité.",
      submit: "Créer mon plan", sending: "Création …",
      errMail: "Merci de vérifier l'adresse e-mail.", errFacility: "Merci d'indiquer le nom de votre établissement.", errSend: "Ça n'a pas marché. Merci de réessayer.", errMany: "Trop d'essais. Merci de réessayer plus tard.",
      congrats: "Félicitations, {n} : votre établissement est au", level: "Niveau", of5: "sur 5",
      lose: "Les postes vides vous coûtent", loseYear: "Avec les départs, par an", win: "Chaque infirmière qui reste vous rapporte", perMonth: "par mois",
      sentTo: "Votre plan en PDF est en route vers", spam: "Rien reçu ? Regardez dans les spams.", notSent: "Nous avons vos réponses. Nous vous envoyons le PDF très vite.",
      tipsNote: "Merci de confirmer les conseils avec le bouton dans l'e-mail.",
      bottomL: "En résumé", gradByL: "Monter en",
      readH: "Votre plan, dès maintenant", readP: "Pendant que le PDF arrive, vous pouvez commencer ici.",
      plan90: "Le plan de 90 jours", reasons: "7 raisons pour lesquelles elles partent", why: "Pourquoi", fix: "Ce qui aide",
      fitP: "Nous travaillons avec 10 employeurs au maximum par groupe, et tous ne correspondent pas. En 15 minutes, nous le découvrons ensemble.", fitBtn: "Vérifier si nous correspondons"
    }
  };

  var lang = "de";
  try { var s0 = localStorage.getItem("bv-lang"); if (T[s0]) lang = s0; } catch (e) {}
  var A = { firstName: "", lastName: "", email: "", phone: "", facility: "", city: "", facilityType: "", staff: 40, openPosts: 3, leftLastYear: 4, agency: "", foreign: "", onboarding: [], pain: "", heardFrom: "", tips: false, consent: false, website: "" };
  // Contact first, then the house (founder's Hormozi breakdown): one thing per screen.
  var STEPS = ["intro", "name", "email", "phone", "facility", "type", "staff", "open", "left", "agency", "foreign", "onb", "pain", "heard", "finish", "result"];
  var at = 0, R = null, emailed = false, busy = false, err = "";

  // Business emails only (founder rule). Same list as lib/roadmap/freeMail.ts.
  var FREE = ["gmail.com","googlemail.com","outlook.com","hotmail.com","live.com","msn.com","yahoo.com","ymail.com","rocketmail.com","icloud.com","me.com","mac.com","aol.com","proton.me","protonmail.com","pm.me","tutanota.com","tutanota.de","tuta.io","tuta.com","gmx.com","mail.com","yandex.com","yandex.ru","mail.ru","zohomail.com","hey.com","gmx.de","gmx.net","gmx.at","gmx.ch","web.de","t-online.de","freenet.de","posteo.de","mailbox.org","arcor.de","online.de","email.de","outlook.de","hotmail.de","live.de","yahoo.de","aol.de","bluewin.ch","kabelmail.de","vodafonemail.de","ewe.net","orange.fr","wanadoo.fr","free.fr","laposte.net","sfr.fr","neuf.fr","bbox.fr","outlook.fr","hotmail.fr","live.fr","yahoo.fr","aol.fr","gmx.fr","skynet.be","hotmail.co.uk","yahoo.co.uk","outlook.at","hotmail.it","libero.it"];
  function isFree(m) { var i = String(m || "").trim().toLowerCase().lastIndexOf("@"); return i >= 0 && FREE.indexOf(String(m).trim().toLowerCase().slice(i + 1)) >= 0; }
  var card = document.getElementById("card"), bar = document.getElementById("bar");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function eur(n) {
    var v = Math.round(n);
    if (lang === "en") return "€" + v.toLocaleString("en-GB");
    return v.toLocaleString(lang === "de" ? "de-DE" : "fr-FR").replace(/[  ]/g, " ") + " €";
  }
  function go(i) { at = Math.max(0, Math.min(STEPS.length - 1, i)); err = ""; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  function nav(showNext, extra) {
    return '<p class="err" id="err">' + esc(err) + '</p><div class="row">' +
      (at > 1 && at < STEPS.length - 1 ? '<button type="button" class="ghost" data-act="back">← ' + esc(T[lang].back) + '</button>' : '<span></span>') +
      '<span style="display:flex;gap:14px;align-items:center">' + (extra || "") +
      (showNext ? '<button type="button" class="btn" data-act="next">' + esc(T[lang].next) + ' →</button>' : "") + '</span></div>';
  }
  function choice(key, map) {
    return '<div class="opts">' + Object.keys(map).map(function (k) {
      return '<button type="button" class="opt" data-set="' + key + '" data-val="' + k + '" aria-pressed="' + (A[key] === k) + '">' + esc(map[k]) + '</button>';
    }).join("") + '</div>';
  }
  function field(id, type, ph, val, ac, max) {
    return '<input type="' + type + '" id="' + id + '" autocomplete="' + ac + '" placeholder="' + esc(ph) + '" value="' + esc(val) + '" maxlength="' + max + '">';
  }
  function numStep(q, key) {
    return '<h2>' + esc(q) + '</h2><p>' + esc(T[lang].hintNum) + '</p>' +
      '<div class="num"><button type="button" data-inc="' + key + '" data-d="-1" aria-label="-">−</button>' +
      '<input id="numIn" type="number" inputmode="numeric" min="0" max="5000" value="' + A[key] + '" data-key="' + key + '">' +
      '<button type="button" data-inc="' + key + '" data-d="1" aria-label="+">+</button></div>' + nav(true);
  }

  function render() {
    var t = T[lang], s = STEPS[at], h = "";
    document.documentElement.lang = lang;
    document.getElementById("banner").innerHTML = t.banner;
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false"); });
    bar.style.width = (at / (STEPS.length - 1) * 100) + "%";
    if (s === "intro") {
      h = '<p class="eyebrow">' + esc(t.eyebrow) + '</p><h1>' + esc(t.h) + '</h1><p class="lead">' + esc(t.lead) + '</p>' +
        '<ul class="gets">' + t.gets.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join("") + '</ul>' +
        '<div class="row"><span></span><button type="button" class="btn" data-act="next">' + esc(t.start) + ' →</button></div>';
    } else if (s === "name") {
      h = '<h2>' + esc(t.qName) + '</h2><div class="two">' + field("fFirst", "text", t.phFirst, A.firstName, "given-name", 60) + field("fLast", "text", t.phLast, A.lastName, "family-name", 80) + '</div>' + nav(true);
    } else if (s === "email") {
      h = '<h2>' + esc(t.qEmail) + '</h2><p>' + esc(t.hEmail) + '</p>' + field("fEmail", "email", "name@haus.de", A.email, "email", 254) + nav(true);
    } else if (s === "phone") {
      h = '<h2>' + esc(t.qPhone) + '</h2><p>' + esc(t.hPhone) + '</p>' + field("fPhone", "tel", "+49 …", A.phone, "tel", 40) + nav(true, '<button type="button" class="ghost" data-act="skip">' + esc(t.skip) + '</button>');
    } else if (s === "facility") {
      h = '<h2>' + esc(t.qFacility) + '</h2>' + field("fFacility", "text", t.phFacility, A.facility, "organization", 120) + '<div style="height:10px"></div>' + field("fCity", "text", t.phCity, A.city, "address-level2", 80) + nav(true);
    } else if (s === "type") { h = '<h2>' + esc(t.qType) + '</h2>' + choice("facilityType", t.types) + nav(false); }
    else if (s === "staff") { h = numStep(t.qStaff, "staff"); }
    else if (s === "open") { h = numStep(t.qOpen, "openPosts"); }
    else if (s === "left") { h = numStep(t.qLeft, "leftLastYear"); }
    else if (s === "agency") { h = '<h2>' + esc(t.qAgency) + '</h2>' + choice("agency", t.agency) + nav(false); }
    else if (s === "foreign") { h = '<h2>' + esc(t.qForeign) + '</h2>' + choice("foreign", t.foreign) + nav(false); }
    else if (s === "onb") {
      h = '<h2>' + esc(t.qOnb) + '</h2><p>' + esc(t.hintMulti) + '</p><div class="opts">' +
        Object.keys(t.onb).map(function (k) { return '<button type="button" class="opt" data-multi="' + k + '" aria-pressed="' + (A.onboarding.indexOf(k) >= 0) + '">' + esc(t.onb[k]) + '</button>'; }).join("") +
        '<button type="button" class="opt" data-multi="__none" aria-pressed="false">' + esc(t.none) + '</button></div>' + nav(true);
    }
    else if (s === "pain") { h = '<h2>' + esc(t.qPain) + '</h2>' + choice("pain", t.pain) + nav(false); }
    else if (s === "heard") { h = '<h2>' + esc(t.qHeard) + '</h2>' + choice("heardFrom", t.heard) + nav(false); }
    else if (s === "finish") {
      h = '<h2>' + esc(t.qFinish) + '</h2><p class="lead">' + esc(t.pFinish) + ' <b>' + esc(A.email) + '</b>.</p>' +
        '<label class="hp" aria-hidden="true">Website<input type="text" id="fWeb" tabindex="-1" autocomplete="off"></label>' +
        '<label class="chk"><input type="checkbox" id="fConsent" required aria-required="true"' + (A.consent ? " checked" : "") + '><span>' + esc(t.consent) + ' <a href="/privacy-policy" target="_blank" rel="noopener">' + esc(t.privacyLink) + '</a></span></label>' +
        '<label class="chk"><input type="checkbox" id="fTips"' + (A.tips ? " checked" : "") + '><span>' + esc(t.tips) + '</span></label>' +
        '<p class="err" id="err">' + esc(err) + '</p>' +
        '<div class="row"><button type="button" class="ghost" data-act="back">← ' + esc(t.back) + '</button><button type="button" class="btn" data-act="submit"' + (busy ? " disabled" : "") + '>' + esc(busy ? t.sending : t.submit) + '</button></div>';
    } else if (s === "result" && R) {
      var r = R.result;
      var lad = (R.ladder || []).map(function (c) {
        return '<div class="lc' + (c.current ? " cur" : "") + '"><span class="k">' + esc(t.level) + ' ' + c.level + '</span><b>' + esc(c.name) + '</b><small>' + esc(c.line) + '</small></div>';
      }).join("");
      h = '<div class="congrats"><p class="eyebrow">' + esc(t.congrats.replace("{n}", A.firstName || "").replace(/, :/, ":").replace(/,\s*:/, ":")) + '</p><h2>' + esc(t.level) + ' ' + r.level + ' ' + esc(t.of5) + '</h2></div>' +
        '<div class="ladder' + ((R.ladder || []).length === 2 ? " two-col" : "") + '">' + lad + '</div>' +
        '<div class="sent"><div>' + esc(t.sentTo) + ' <b>' + esc(A.email) + '</b>.<br><span class="small">' + esc(t.spam) + (A.tips ? " " + esc(t.tipsNote) : "") + '</span></div></div>' +
        '<div class="fit"><p>' + esc(t.fitP) + '</p><a class="btn" href="/book/clinic" data-book>' + esc(t.fitBtn) + ' →</a></div>';
    }
    card.innerHTML = '<div class="step">' + h + '</div>';
    var first = card.querySelector("input:not([type=checkbox]):not(#fWeb)"); if (first && s !== "finish") { first.focus(); if (first.select) first.select(); }
  }

  function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : null; }
  function readCurrent() {
    var v;
    if ((v = val("fFirst")) !== null) A.firstName = v;
    if ((v = val("fLast")) !== null) A.lastName = v;
    if ((v = val("fEmail")) !== null) A.email = v;
    if ((v = val("fPhone")) !== null) A.phone = v;
    if ((v = val("fFacility")) !== null) A.facility = v;
    if ((v = val("fCity")) !== null) A.city = v;
    if ((v = val("fWeb")) !== null) A.website = v;
    var tp = document.getElementById("fTips"); if (tp) A.tips = !!tp.checked;
    var cs = document.getElementById("fConsent"); if (cs) A.consent = !!cs.checked;
    var nu = document.getElementById("numIn"); if (nu) { var n = parseInt(nu.value, 10); A[nu.getAttribute("data-key")] = isNaN(n) ? 0 : Math.max(0, Math.min(5000, n)); }
  }
  /** Can we leave this step forward? Sets err and re-renders if not. */
  function okToLeave() {
    var t = T[lang], s = STEPS[at];
    if (s === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.email)) { err = t.errMail; render(); return false; }
    if (s === "email" && isFree(A.email)) { err = t.errBiz; render(); return false; }
    if (s === "facility" && !A.facility) { err = t.errFacility; render(); return false; }
    return true;
  }
  function submit() {
    var t = T[lang];
    readCurrent();
    if (!A.consent) { err = t.errConsent; render(); return; }
    busy = true; err = ""; render();
    fetch("/api/roadmap", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      lang: lang, firstName: A.firstName, lastName: A.lastName, email: A.email, phone: A.phone, facility: A.facility, city: A.city,
      heardFrom: A.heardFrom, tips: A.tips, consent: A.consent, website: A.website,
      answers: { facilityType: A.facilityType, staff: A.staff, openPosts: A.openPosts, leftLastYear: A.leftLastYear, agency: A.agency, foreign: A.foreign, onboarding: A.onboarding, pain: A.pain }
    }) }).then(function (res) {
      if (res.status === 429) throw new Error("many");
      if (res.status === 400) return res.json().then(function (j) { throw new Error((j && j.error) || "fail"); }, function () { throw new Error("fail"); });
      if (!res.ok) throw new Error("fail");
      return res.json();
    }).then(function (j) {
      busy = false;
      if (!j || !j.result) throw new Error("fail");
      R = j; emailed = !!j.emailed; go(STEPS.length - 1);
    }).catch(function (e) {
      busy = false;
      var m = e && e.message;
      if (m === "business_email" || m === "invalid_email") { at = STEPS.indexOf("email"); err = m === "business_email" ? t.errBiz : t.errMail; render(); return; }
      err = m === "many" ? t.errMany : m === "consent_required" ? t.errConsent : t.errSend; render();
    });
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-book]"); if (b) { try { localStorage.setItem("borivon-lang", lang); } catch (x) {} }
  });
  card.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "next") { readCurrent(); if (okToLeave()) go(at + 1); return; }
    if (act === "skip") { var el = document.getElementById("fPhone"); if (el) el.value = ""; A.phone = ""; go(at + 1); return; }
    if (act === "back") { readCurrent(); go(at - 1); return; }
    if (act === "submit") { submit(); return; }
    if (b.hasAttribute("data-set")) { A[b.getAttribute("data-set")] = b.getAttribute("data-val"); render(); setTimeout(function () { go(at + 1); }, 220); return; }
    if (b.hasAttribute("data-multi")) {
      var k = b.getAttribute("data-multi");
      if (k === "__none") { A.onboarding = []; render(); setTimeout(function () { go(at + 1); }, 220); return; }
      var i = A.onboarding.indexOf(k); if (i >= 0) A.onboarding.splice(i, 1); else A.onboarding.push(k);
      render(); return;
    }
    if (b.hasAttribute("data-inc")) {
      var key = b.getAttribute("data-inc"); readCurrent();
      A[key] = Math.max(0, Math.min(5000, (A[key] || 0) + parseInt(b.getAttribute("data-d"), 10)));
      render(); return;
    }
  });
  card.addEventListener("input", function (e) {
    if (e.target.id !== "fEmail") return;
    var el = document.getElementById("err"); if (!el) return;
    el.textContent = isFree(e.target.value) ? T[lang].errBiz : (el.textContent === T[lang].errBiz ? "" : el.textContent);
  });
  card.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT" || e.target.type === "checkbox") return;
    e.preventDefault();
    readCurrent();
    if (STEPS[at] === "finish") submit(); else if (okToLeave()) go(at + 1);
  });
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () { readCurrent(); lang = b.getAttribute("data-lang"); try { localStorage.setItem("bv-lang", lang); } catch (e) {} render(); });
  });
  render();
})();
